resources:
  jobs:
    job_ops_refresh:
      name: "[Job Ops] refresh — snapshot system tables every 15 minutes"
      description: Rebuilds job_runs, task_runs, pipeline_updates and table_freshness from the system-table views.
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: UTC
        pause_status: ${var.refresh_schedule}
      max_concurrent_runs: 1
      tasks:
        - task_key: snapshots
          notebook_task:
            notebook_path: ../src/notebooks/setup_objects.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              ops_group: ${var.ops_group}
              zeroops_url: ${var.zeroops_url}
              bundle_root: ${workspace.file_path}
              only_files: 02_snapshots.sql
              schema_only_scope: ${var.schema_only_scope}
